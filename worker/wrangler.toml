name = "cap621-push-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = false

# Run `npx wrangler kv namespace create SUBSCRIPTIONS` and paste the returned id below.
# Run `npx wrangler kv namespace create SUBSCRIPTIONS --preview` and paste the returned id as preview_id.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "YOUR_KV_NAMESPACE_ID"       # ← replace with the id from: wrangler kv namespace create SUBSCRIPTIONS
preview_id = "YOUR_KV_PREVIEW_ID" # ← replace with the id from: wrangler kv namespace create SUBSCRIPTIONS --preview

[vars]
# Replace with a valid email address (used in the VAPID "sub" claim).
VAPID_EMAIL = "mailto:your@email.com"
# VAPID public key — must match the value in src/lib/pushUtils.ts
VAPID_PUBLIC_KEY = "BGHC4LEgcSRLCwSR6ZgPfpwfgNcy_Iftn7McC5HFqg6OlTVdkuB-UwuwGSzJsEfpVZaKIIxYtWo3wqz1WiFWO3k"

# Secrets — set via Wrangler CLI (never commit these):
#   wrangler secret put VAPID_PRIVATE_KEY   → paste: ZvuJlaHmLeglmnCuIKe4FJz7EyCxGOPqbp8C4qrToKA
#   wrangler secret put SEND_SECRET         → paste: <random string, e.g. openssl rand -hex 32>
